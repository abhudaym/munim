[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munim"
version = "0.1.0"
description = "Expenses, investments and balances in one SQL database."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
munim = "munim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["munim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"munim.ask" = ["golden.json"]
